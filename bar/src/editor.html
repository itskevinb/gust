<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gust curve</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --grid: #e4e4e0;
    --line: #2f6fdb; --auto: #9a9aa0; --hot: #d0422c; --live: #e08a00; --ok: #2c8a4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --panel: #242426; --ink: #f2f2f2; --muted: #9a9aa0; --grid: #38383b;
      --line: #6fa0ff; --auto: #7a7a80; --hot: #ff6a52; --live: #ffb340; --ok: #5cc982;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; padding: 14px 16px; gap: 10px; }
  header { display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #live { color: var(--muted); font-variant-numeric: tabular-nums; }
  #chart { flex: 1; background: var(--panel); border-radius: 10px; min-height: 0; }
  svg { width: 100%; height: 100%; display: block; }
  .grid line { stroke: var(--grid); }
  .axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .curve { fill: none; stroke: var(--line); stroke-width: 2.5; }
  .autoseg { fill: none; stroke: var(--auto); stroke-width: 2.5; stroke-dasharray: 5 5; }
  .pt { fill: var(--panel); stroke: var(--line); stroke-width: 2.5; cursor: grab; }
  .pt.auto { stroke: var(--auto); }
  .pt.sel { fill: var(--line); }
  .pt.auto.sel { fill: var(--auto); }
  .lane { fill: var(--grid); opacity: .45; }
  .lanelabel { fill: var(--muted); font-size: 11px; }
  .emerg { fill: var(--hot); opacity: .08; }
  .emergline { stroke: var(--hot); stroke-dasharray: 3 4; }
  .emergtext { fill: var(--hot); font-size: 11px; }
  .liveline { stroke: var(--live); stroke-width: 1.5; }
  .livedot { fill: var(--live); }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg);
    padding: 4px 8px; border-radius: 6px; font-size: 12px; display: none; font-variant-numeric: tabular-nums; }
  footer { display: flex; align-items: center; gap: 10px; }
  footer .hint { color: var(--muted); flex: 1; }
  button { font: inherit; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--grid);
    background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--line); border-color: var(--line); color: #fff; }
  select { font: inherit; margin-left: 4px; }
  input[type=number] { font: inherit; width: 58px; margin-left: 4px; padding: 2px 4px; }
  button:disabled { opacity: .45; cursor: default; }
  #msg { min-width: 0; font-variant-numeric: tabular-nums; }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--hot); }
</style>
</head>
<body>
<header><h1>Fan curve</h1><span id="live">waiting for sensors…</span></header>
<div id="chart"><svg id="svg"></svg></div>
<footer>
  <span class="hint">Drag points · click empty space to add · double-click a point to remove · drag into the bottom lane for <b>auto</b></span>
  <span id="msg"></span>
  <label title="The curve follows the average of the hottest sensor over this many seconds, so short spikes don't move the fans. 0 = off. The 100°C override always uses the live reading.">Average <input id="avg" type="number" min="0" max="600" step="5"> s</label>
  <label>Shape <select id="shape"><option value="linear">Linear</option><option value="log">Log</option><option value="exp">Exp</option></select></label>
  <button id="revert">Revert</button>
  <button id="save" class="primary" disabled>Save</button>
</footer>
<div id="tip"></div>
<script>
// window.GUST = { points: [{t, auto, pct}], fans: [{min, max}], emergency, shape } is injected by gust-bar.
const G = window.GUST;
const T0 = 40, T1 = 105;                 // x range, °C
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const tip = document.getElementById("tip");
const saveBtn = document.getElementById("save");
const msg = document.getElementById("msg");
let pts = G.points.map(p => ({ ...p }));
let shape = G.shape || "linear";
let average = G.average || 0;
const snapshot = () => JSON.stringify({ pts, shape, average });
let saved = snapshot();
const shapeSel = document.getElementById("shape");
shapeSel.value = shape;
shapeSel.addEventListener("change", () => { shape = shapeSel.value; draw(); });
const avgIn = document.getElementById("avg");
avgIn.value = average;
avgIn.addEventListener("input", () => {
  const v = Math.round(Number(avgIn.value));
  average = Number.isFinite(v) ? Math.min(Math.max(v, 0), 600) : 0;
  draw();
});
// Same as gust's Shape::apply.
const bend = f => shape === "log" ? Math.log10(1 + 9 * f) : shape === "exp" ? (Math.pow(10, f) - 1) / 9 : f;
let sel = -1, drag = -1, live = null;
let W = 0, H = 0;
const M = { l: 48, r: 64, t: 16, b: 66 };  // margins; bottom holds the auto lane + axis
const LANE = 26;                           // auto lane height

const x = t => M.l + (t - T0) / (T1 - T0) * (W - M.l - M.r);
const y = p => M.t + (1 - p / 100) * (H - M.t - M.b - LANE);
const laneY = () => H - M.b - LANE / 2 + 6;
const tOf = px => T0 + (px - M.l) / (W - M.l - M.r) * (T1 - T0);
const pOf = py => 100 * (1 - (py - M.t) / (H - M.t - M.b - LANE));
const rpm = (f, pct) => Math.round(f.min + (f.max - f.min) * pct / 100);

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}

// Same rule as gust's Curve::target, as % of each fan's range. null = auto.
function evalAt(t) {
  if (t >= G.emergency) return 100;
  if (t <= pts[0].t) return pts[0].auto ? null : pts[0].pct;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (t < b.t) {
      if (a.auto) return null;
      if (b.auto) return a.pct;
      return a.pct + (b.pct - a.pct) * bend((t - a.t) / (b.t - a.t));
    }
  }
  const last = pts[pts.length - 1];
  return last.auto ? null : last.pct;
}

function draw() {
  const r = svg.getBoundingClientRect(); W = r.width; H = r.height;
  svg.innerHTML = "";
  const grid = el("g", { class: "grid axis" });
  for (let t = T0; t <= T1; t += 5) {
    el("line", { x1: x(t), x2: x(t), y1: M.t, y2: H - M.b }, grid);
    el("text", { x: x(t), y: H - M.b + 18, "text-anchor": "middle" }, grid).textContent = t + "°";
  }
  for (let p = 0; p <= 100; p += 20) {
    el("line", { x1: M.l, x2: W - M.r, y1: y(p), y2: y(p) }, grid);
    el("text", { x: M.l - 8, y: y(p) + 4, "text-anchor": "end" }, grid).textContent = p + "%";
    if (G.fans[0]) el("text", { x: W - M.r + 8, y: y(p) + 4 }, grid).textContent = rpm(G.fans[0], p);
  }
  el("text", { x: W - M.r + 8, y: M.t - 4, class: "lanelabel" }).textContent = "RPM fan 0";
  el("text", { x: (M.l + W - M.r) / 2, y: H - 14, "text-anchor": "middle", class: "lanelabel" })
    .textContent = "hottest CPU / GPU sensor, °C";
  // auto lane
  el("rect", { x: M.l, y: H - M.b - LANE + 4, width: W - M.l - M.r, height: LANE - 6, rx: 5, class: "lane" });
  el("text", { x: M.l - 8, y: laneY() + 4, "text-anchor": "end", class: "lanelabel" }).textContent = "auto";
  // emergency zone
  el("rect", { x: x(G.emergency), y: M.t, width: W - M.r - x(G.emergency), height: H - M.b - M.t, class: "emerg" });
  el("line", { x1: x(G.emergency), x2: x(G.emergency), y1: M.t, y2: H - M.b, class: "emergline" });
  el("text", { x: x(G.emergency) - 6, y: M.t + 14, "text-anchor": "end", class: "emergtext" })
    .textContent = "gustd forces max from " + G.emergency + "°";

  // curve, sampled with the same rule gustd uses
  let d = "", ad = "", prev = null;
  for (let px = x(T0); px <= x(T1); px += 2) {
    const t = tOf(px), v = evalAt(t);
    const py = v === null ? laneY() : y(v);
    const isAuto = v === null;
    if (prev === null || prev !== isAuto) {
      if (isAuto) ad += `M${px},${py}`; else d += `M${px},${py}`;
    } else {
      if (isAuto) ad += `L${px},${py}`; else d += `L${px},${py}`;
    }
    prev = isAuto;
  }
  el("path", { d: ad, class: "autoseg" });
  el("path", { d, class: "curve" });

  if (live) {
    const ct = live.avg ?? live.temp;   // the temperature gustd's curve is using
    const lx = x(Math.min(Math.max(ct, T0), T1));
    el("line", { x1: lx, x2: lx, y1: M.t, y2: H - M.b, class: "liveline" });
    const v = evalAt(ct);
    el("circle", { cx: lx, cy: v === null ? laneY() : y(v), r: 5, class: "livedot" });
  }

  pts.forEach((p, i) => {
    const c = el("circle", {
      cx: x(p.t), cy: p.auto ? laneY() : y(p.pct), r: 7,
      class: "pt" + (p.auto ? " auto" : "") + (i === sel ? " sel" : ""),
    });
    c.addEventListener("mousedown", e => { e.stopPropagation(); drag = sel = i; draw(); });
    c.addEventListener("dblclick", e => { e.stopPropagation(); remove(i); });
    c.addEventListener("mousemove", e => showTip(e, p));
    c.addEventListener("mouseleave", () => { if (drag < 0) tip.style.display = "none"; });
  });
  saveBtn.disabled = snapshot() === saved;
}

function label(p) {
  if (p.auto) return `${p.t.toFixed(1)}°C → auto (macOS decides)`;
  const r = G.fans.map(f => rpm(f, p.pct)).join(" / ");
  return `${p.t.toFixed(1)}°C → ${p.pct.toFixed(0)}%  (${r} RPM)`;
}
function showTip(e, p) {
  tip.textContent = label(p);
  tip.style.display = "block";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY - 30) + "px";
}

function remove(i) {
  if (pts.length <= 1) return;
  pts.splice(i, 1); sel = -1; tip.style.display = "none"; draw();
}

svg.addEventListener("mousedown", e => {
  if (drag >= 0) return;
  const r = svg.getBoundingClientRect();
  const t = Math.round(tOf(e.clientX - r.left) * 2) / 2;
  if (t <= T0 || t >= T1 || pts.some(p => Math.abs(p.t - t) < 1)) return;
  const v = evalAt(t);
  pts.push({ t, auto: false, pct: v === null ? 0 : Math.round(v) });
  pts.sort((a, b) => a.t - b.t);
  sel = drag = pts.findIndex(p => p.t === t);
  draw();
});

window.addEventListener("mousemove", e => {
  if (drag < 0) return;
  const r = svg.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const lo = drag > 0 ? pts[drag - 1].t + 1 : T0;
  const hi = drag < pts.length - 1 ? pts[drag + 1].t - 1 : T1;
  const p = pts[drag];
  p.t = Math.min(Math.max(Math.round(tOf(px) * 2) / 2, lo), hi);
  if (py > H - M.b - LANE) { p.auto = true; }
  else { p.auto = false; p.pct = Math.min(Math.max(Math.round(pOf(py)), 0), 100); }
  showTip(e, p);
  draw();
});
window.addEventListener("mouseup", () => { drag = -1; });

window.addEventListener("keydown", e => {
  if ((e.key === "Backspace" || e.key === "Delete") && sel >= 0) remove(sel);
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (!saveBtn.disabled) save(); }
});

function save() {
  msg.className = ""; msg.textContent = "saving…";
  avgIn.value = average;
  window.ipc.postMessage(JSON.stringify({ cmd: "save", points: pts, shape, average }));
}
saveBtn.addEventListener("click", save);
document.getElementById("revert").addEventListener("click", () => {
  const s0 = JSON.parse(saved); pts = s0.pts; shape = s0.shape; shapeSel.value = shape;
  average = s0.average; avgIn.value = average;
  sel = -1; msg.textContent = ""; draw();
});

// Called by gust-bar.
window.gustSaved = (ok, text) => {
  msg.className = ok ? "ok" : "err"; msg.textContent = text;
  if (ok) saved = snapshot();
  draw();
};
window.gustLive = (l) => {
  live = l;
  const fans = (l.rpm || []).map(r => r + " RPM").join(" · ");
  const avg = l.avg != null ? ` · curve sees ${l.avg.toFixed(1)}°C (avg)` : "";
  document.getElementById("live").textContent =
    `now ${l.temp.toFixed(1)}°C (${l.sensor})${avg} · ${l.mode} · ${fans}`;
  if (drag < 0) draw();
};

window.addEventListener("resize", draw);
draw();
</script>
</body>
</html>
