# gust fan curve. Edit here or with "Curve editor…" in the gust menu.
# gustd reloads this file within 2 s of a save, and refuses a broken one
# (it keeps running the last good curve and says so in the menu and log).
#
# Which sensors drive the fans: the hottest one wins. * matches any ending.
# Run `gust temps` to see your Mac's sensors. On an M1 Max, Tp0* TC1* TCDX
# rose with CPU load and Tg* TC2* TC3* with GPU load. Other chips may differ.
sensors = Tp0* TC1* TCDX Tg* TC2* TC3*

# point <temp °C> <speed>
#   speed: auto (macOS decides), max, an RPM (2500), or a percent of each
#   fan's min..max range (40%).
point 50 auto
point 60 0%
point 95 max

# Optional settings.
#   shape = linear | log | exp   bend between points (log: fast then flat; exp: low then steep)
#   average = 15                 follow the 15 s rolling average temperature (0 = off)
#   ramp_up = 100                speed up at most 100 RPM per second
#   ramp_down = 50               slow down at most 50 RPM per second
# Whatever this file says, gustd runs every fan at max from 100°C.
shape = linear
average = 15
ramp_up = 100
ramp_down = 50
